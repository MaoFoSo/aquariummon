name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, Version und Changelog prüfen
        run: node scripts/check.mjs index.html
      - name: Browser-Test (Titelbildschirm startet ohne Fehler)
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs index.html
