const DEAL_OFF = 0.4, DEAL_MAX = 3;
function dealKey(dateStr) {
  let h = 11;
  const str = "deal:" + String(dateStr || "");
  for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0;
  return SHOP_KEYS[h % SHOP_KEYS.length];
}
const dealPrice = k => Math.max(5, Math.round(ITEMS[k].price * (1 - DEAL_OFF) / 5) * 5);
function dealLeft(p, dateStr) {
  return p && p.dealDay === dateStr ? Math.max(0, DEAL_MAX - (p.dealBought || 0)) : DEAL_MAX;
}

  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {

      b = (y - 19) / 7,

// Startposition = direkt über der Ausgangskachel
function cityEntryPos(id) {
  const M = cityMap(id);
  let ex = -1,
    ey = -1;
  for (let y = KH - 1; y >= 0 && ex < 0; y--) for (let x = 0; x < KW; x++) if (M[y][x] === K_EXIT) {
    ex = x;
    ey = y;
    break;
  }
  if (ex < 0) return {
    pos: {
      x: 10 * KTS + KTS / 2,
      y: 12 * KTS + KTS / 2
    },
    facing: "up"
  };
  // Ringsuche um den Ausgang nach dem nächsten begehbaren Feld (Ausgang selbst ausgenommen)
  for (let r = 1; r <= 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const nx = ex + dx,
      ny = ey + dy;
    if (nx < 0 || ny < 0 || nx >= KW || ny >= KH) continue;
    const t = M[ny][nx];
    if (t === K_EXIT || SOLID.has(t)) continue;
    return {
      pos: {
        x: nx * KTS + KTS / 2,
        y: ny * KTS + KTS / 2
      },
      facing: dy > 0 ? "up" : "down"
    };
  }
  return {
    pos: {
      x: ex * KTS + KTS / 2,
      y: ey * KTS + KTS / 2
    },
    facing: "up"
  };
}

/* ───── STADT-KACHELN (16-Bit-Look) ───── */
function drawCityTile(ctx, t, px, py, S, fr, gx = 0, gy = 0) {
  if (t === K_ARENA) {
    // Arena: Steinbau mit Säulen und Wimpel
    ctx.fillStyle = "#7c2d12";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#a8a29e";
    ctx.fillRect(px + 1, py + S * .3, S - 2, S * .7);
    ctx.fillStyle = "#78716c";
    for (let i = 0; i < 3; i++) ctx.fillRect(px + 3 + i * (S * .32), py + S * .38, S * .13, S * .55);
    ctx.fillStyle = "#b91c1c";
    ctx.beginPath();
    ctx.moveTo(px, py + S * .32);
    ctx.lineTo(px + S / 2, py + 2);
    ctx.lineTo(px + S, py + S * .32);
    ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.font = `bold ${S * .32 | 0}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("⚔", px + S / 2, py + S * .68);
  } else if (t === K_CENTER) {
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(px + 1, py + 1, S - 2, S * .28);
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(px + 1, py + S * .28, S - 2, 2);
    const pulse = .55 + Math.sin(fr * .06) * .3;
    ctx.fillStyle = `rgba(239,68,68,${pulse})`;
    ctx.fillRect(px + S * .42, py + S * .4, S * .16, S * .45);
    ctx.fillRect(px + S * .28, py + S * .53, S * .44, S * .16);
  } else if (t === K_EXIT) {
    drawTile(ctx, T_PATH, px, py, S, fr, gx, gy);
    ctx.fillStyle = "rgba(253,224,71,.25)";
    ctx.fillRect(px + 2, py + 2, S - 4, S - 4);
    ctx.fillStyle = "#fde047";
    ctx.font = `bold ${S * .46 | 0}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("▼", px + S / 2, py + S * .55);
  } else if (t === K_PIER) {
    drawCityTile(ctx, K_DECK, px, py, S, fr, gx, gy);
    ctx.fillStyle = "#fde047";
    ctx.font = `bold ${S * .34 | 0}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🎣", px + S / 2, py + S * .5);
  } else if (t === K_SEESTERN) {
    ctx.fillStyle = "#4c1d95";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#6d28d9";
    ctx.fillRect(px + 1, py + S * .32, S - 2, S * .68);
    ctx.fillStyle = "#a78bfa";
    ctx.beginPath();
    ctx.moveTo(px - 1, py + S * .34);
    ctx.lineTo(px + S / 2, py + 1);
    ctx.lineTo(px + S + 1, py + S * .34);
    ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.fillRect(px + S * .36, py + S * .5, S * .28, S * .4);
    ctx.fillStyle = "#c4b5fd";
    ctx.fillRect(px + S * .12, py + S * .44, S * .16, S * .16);
    ctx.fillRect(px + S * .72, py + S * .44, S * .16, S * .16);
  } else if (t === K_DECK) {
    // Holzsteg über Wasser
    drawTile(ctx, T_WATER, px, py, S, fr, gx, gy);
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(px, py + 2, S, S - 4);
    ctx.fillStyle = "#a16207";
    for (let i = 0; i < 3; i++) ctx.fillRect(px + 1, py + 3 + i * (S * .31), S - 2, S * .22);
    ctx.fillStyle = "#5c3317";
    ctx.fillRect(px, py + 2, S, 1);
    ctx.fillRect(px, py + S - 3, S, 1);
  } else if (t === K_WALL) {
    // Stadtmauer mit Zinnen
    ctx.fillStyle = "#57534e";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#78716c";
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) ctx.fillRect(px + 2 + c * (S * .5) + (r % 2 ? S * .25 : 0), py + 3 + r * (S * .32), S * .42, S * .26);
    ctx.fillStyle = "#44403c";
    ctx.fillRect(px, py, S, 2);
    ctx.fillStyle = "#a8a29e";
    for (let i = 0; i < 3; i++) ctx.fillRect(px + i * (S * .36) + 1, py, S * .22, 3);
  } else if (t === K_ROCK) {
    // Fels / Berghang (Pfänder)
    ctx.fillStyle = "#44403c";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#57534e";
    ctx.beginPath();
    ctx.moveTo(px, py + S);
    ctx.lineTo(px + S * .3, py + S * .25);
    ctx.lineTo(px + S * .62, py + S);
    ctx.fill();
    ctx.fillStyle = "#78716c";
    ctx.beginPath();
    ctx.moveTo(px + S * .4, py + S);
    ctx.lineTo(px + S * .72, py + S * .35);
    ctx.lineTo(px + S, py + S);
    ctx.fill();
    ctx.fillStyle = "#e7e5e4";
    ctx.beginPath();
    ctx.moveTo(px + S * .24, py + S * .36);
    ctx.lineTo(px + S * .3, py + S * .25);
    ctx.lineTo(px + S * .37, py + S * .37);
    ctx.fill();
  } else if (t === K_FLOWER) {
    drawTile(ctx, T_GRASS, px, py, S, fr, gx, gy);
    ctx.fillStyle = "#3f2a14";
    ctx.fillRect(px + 2, py + 2, S - 4, S - 4);
    const cols = ["#fb7185", "#fbbf24", "#f472b6", "#a3e635", "#93c5fd"];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      ctx.fillStyle = cols[(gx + gy + r * 3 + c) % cols.length];
      ctx.beginPath();
      ctx.arc(px + 7 + c * 9, py + 7 + r * 9, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (t === K_LAND) {
    // Sockel der Wahrzeichen – Detail kommt in drawCityDeco obendrauf
    ctx.fillStyle = "#6b7280";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#9ca3af";
    ctx.fillRect(px + 1, py + 1, S - 2, S - 2);
  } else drawTile(ctx, t, px, py, S, fr, gx, gy);
}

/* ───── WAHRZEICHEN ───── */
function drawLandmark(ctx, kind, x, y, w, h, fr) {
  const W = w * KTS,
    H = h * KTS,
    cx = x + W / 2;
  if (kind === "muenster") {
    // Münster mit hohem Turm
    ctx.fillStyle = "#57534e";
    ctx.fillRect(x, y + H * .25, W, H * .75);
    ctx.fillStyle = "#78716c";
    ctx.fillRect(x + 2, y + H * .3, W - 4, H * .65);
    ctx.fillStyle = "#7f1d1d";
    ctx.beginPath();
    ctx.moveTo(x - 2, y + H * .28);
    ctx.lineTo(cx, y + H * .05);
    ctx.lineTo(x + W + 2, y + H * .28);
    ctx.fill();
    ctx.fillStyle = "#44403c";
    ctx.fillRect(cx - W * .13, y - H * .5, W * .26, H * .78);
    ctx.fillStyle = "#166534";
    ctx.beginPath();
    ctx.moveTo(cx - W * .16, y - H * .48);
    ctx.lineTo(cx, y - H * .95);
    ctx.lineTo(cx + W * .16, y - H * .48);
    ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.fillRect(cx - 1.5, y - H * 1.06, 3, H * .12);
    ctx.fillRect(cx - 5, y - H * 1.0, 10, 3);
    ctx.fillStyle = "#1e293b";
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(x + W * (.25 + i * .25), y + H * .6, W * .06, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(x + W * (.25 + i * .25) - W * .06, y + H * .6, W * .12, H * .3);
    }
    ctx.fillStyle = "#93c5fd";
    ctx.beginPath();
    ctx.arc(cx, y - H * .2, W * .07, 0, Math.PI * 2);
    ctx.fill();
  } else if (kind === "konzil") {
    // Konzilgebäude am Hafen
    ctx.fillStyle = "#a16207";
    ctx.fillRect(x, y + H * .22, W, H * .78);
    ctx.fillStyle = "#ca8a04";
    ctx.fillRect(x + 2, y + H * .28, W - 4, H * .68);
    ctx.fillStyle = "#7c2d12";
    ctx.beginPath();
    ctx.moveTo(x - 3, y + H * .26);
    ctx.lineTo(cx, y - H * .06);
    ctx.lineTo(x + W + 3, y + H * .26);
    ctx.fill();
    ctx.fillStyle = "#78350f";
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) ctx.fillRect(x + W * .1 + c * W * .22, y + H * .4 + r * H * .26, W * .12, H * .16);
    ctx.fillStyle = "#e5e7eb";
    ctx.fillRect(x + W * .44, y + H * .7, W * .12, H * .3);
  } else if (kind === "imperia") {
    // Imperia-Statue auf dem Sockel
    ctx.fillStyle = "#57534e";
    ctx.fillRect(x + W * .2, y + H * .7, W * .6, H * .3);
    const rot = Math.sin(fr * .012) * 2;
    ctx.save();
    ctx.translate(cx, y + H * .7);
    ctx.rotate(rot * Math.PI / 180);
    ctx.fillStyle = "#d6d3d1";
    ctx.beginPath();
    ctx.moveTo(-W * .16, 0);
    ctx.lineTo(-W * .07, -H * .42);
    ctx.lineTo(W * .07, -H * .42);
    ctx.lineTo(W * .16, 0);
    ctx.fill();
    ctx.fillStyle = "#e7e5e4";
    ctx.beginPath();
    ctx.arc(0, -H * .5, W * .1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fbbf24";
    ctx.fillRect(-W * .2, -H * .4, W * .12, H * .08);
    ctx.fillRect(W * .08, -H * .4, W * .12, H * .08);
    ctx.restore();
    ctx.fillStyle = "#a8a29e";
    ctx.fillRect(x + W * .28, y + H * .66, W * .44, H * .06);
  } else if (kind === "zeppelin") {
    // Luftschiff-Museum mit Luftschiff
    ctx.fillStyle = "#57534e";
    ctx.fillRect(x, y + H * .3, W, H * .7);
    ctx.fillStyle = "#d6d3d1";
    ctx.fillRect(x + 2, y + H * .34, W - 4, H * .62);
    ctx.fillStyle = "#1e293b";
    for (let c = 0; c < 5; c++) ctx.fillRect(x + W * .08 + c * W * .18, y + H * .44, W * .1, H * .3);
    ctx.fillStyle = "#7c2d12";
    ctx.fillRect(x, y + H * .26, W, H * .08);
    const drift = Math.sin(fr * .02) * W * .06;
    ctx.fillStyle = "#cbd5e1";
    ctx.beginPath();
    ctx.ellipse(cx + drift, y - H * .12, W * .34, H * .16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath();
    ctx.ellipse(cx + drift, y - H * .12, W * .34, H * .16, 0, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = "#475569";
    ctx.fillRect(cx + drift - W * .05, y - H * .02, W * .1, H * .07);
    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(cx + drift + W * .32, y - H * .12);
    ctx.lineTo(cx + drift + W * .42, y - H * .24);
    ctx.lineTo(cx + drift + W * .42, y - H * .01);
    ctx.fill();
  } else if (kind === "moleturm") {
    // Moleturm am Hafen
    ctx.fillStyle = "#e7e5e4";
    ctx.fillRect(x + W * .26, y - H * .5, W * .48, H * 1.5);
    ctx.fillStyle = "#b91c1c";
    for (let i = 0; i < 3; i++) ctx.fillRect(x + W * .26, y - H * .36 + i * H * .44, W * .48, H * .14);
    ctx.fillStyle = "#57534e";
    ctx.fillRect(x + W * .16, y - H * .66, W * .68, H * .18);
    const gl = .55 + Math.sin(fr * .09) * .35;
    ctx.fillStyle = `rgba(253,224,71,${gl})`;
    ctx.beginPath();
    ctx.arc(cx, y - H * .78, W * .3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    ctx.arc(cx, y - H * .78, W * .14, 0, Math.PI * 2);
    ctx.fill();
  } else if (kind === "leuchtturm") {
    // Neuer Leuchtturm Lindau
    ctx.fillStyle = "#f5f5f4";
    ctx.fillRect(x + W * .22, y - H * .9, W * .56, H * 1.9);
    ctx.fillStyle = "#d6d3d1";
    ctx.fillRect(x + W * .22, y - H * .9, W * .12, H * 1.9);
    ctx.fillStyle = "#78716c";
    ctx.fillRect(x + W * .14, y - H * 1.06, W * .72, H * .2);
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(x + W * .3, y - H * 1.24, W * .4, H * .2);
    const gl = .5 + Math.sin(fr * .11) * .4;
    ctx.fillStyle = `rgba(253,224,71,${gl})`;
    ctx.beginPath();
    ctx.arc(cx, y - H * 1.14, W * .34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.fillRect(x + W * .32, y - H * 1.22, W * .36, H * .16);
    ctx.fillStyle = "#b91c1c";
    ctx.beginPath();
    ctx.moveTo(x + W * .24, y - H * 1.24);
    ctx.lineTo(cx, y - H * 1.42);
    ctx.lineTo(x + W * .76, y - H * 1.24);
    ctx.fill();
    ctx.fillStyle = "#1e293b";
    for (let i = 0; i < 3; i++) ctx.fillRect(cx - W * .06, y - H * .6 + i * H * .5, W * .12, H * .18);
  } else if (kind === "loewe") {
    // Bayerischer Löwe
    ctx.fillStyle = "#a8a29e";
    ctx.fillRect(x + W * .1, y + H * .6, W * .8, H * .4);
    ctx.fillStyle = "#78716c";
    ctx.fillRect(x + W * .14, y + H * .56, W * .72, H * .08);
    ctx.fillStyle = "#e7e5e4";
    ctx.beginPath();
    ctx.ellipse(cx + W * .04, y + H * .3, W * .3, H * .2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x + W * .2, y + H * .34, W * .12, H * .24);
    ctx.fillRect(x + W * .6, y + H * .34, W * .12, H * .24);
    ctx.beginPath();
    ctx.arc(x + W * .26, y + H * .12, W * .19, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#d6d3d1";
    ctx.beginPath();
    ctx.arc(x + W * .26, y + H * .12, W * .25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e7e5e4";
    ctx.beginPath();
    ctx.arc(x + W * .26, y + H * .12, W * .17, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#57534e";
    ctx.beginPath();
    ctx.arc(x + W * .2, y + H * .1, W * .03, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + W * .32, y + H * .1, W * .03, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e7e5e4";
    ctx.beginPath();
    ctx.moveTo(x + W * .78, y + H * .3);
    ctx.quadraticCurveTo(x + W * .98, y + H * .1, x + W * .88, y - H * .02);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#e7e5e4";
    ctx.stroke();
  } else if (kind === "seebuehne") {
    // Bregenzer Seebühne
    ctx.fillStyle = "#0c4a6e";
    ctx.fillRect(x, y + H * .55, W, H * .45);
    ctx.fillStyle = "#155e75";
    ctx.fillRect(x + 2, y + H * .58, W - 4, H * .38);
    ctx.fillStyle = "#78350f";
    ctx.fillRect(x, y + H * .5, W, H * .08);
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = "#5c3317";
      ctx.fillRect(x + W * .06 + i * W * .16, y + H * .58, W * .03, H * .42);
    }
    ctx.fillStyle = "#d97706";
    ctx.beginPath();
    ctx.arc(cx, y + H * .42, W * .36, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.arc(cx, y + H * .42, W * .28, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    ctx.arc(cx, y + H * .42, W * .16, Math.PI, 0);
    ctx.fill();
    for (let i = 0; i < 5; i++) {
      const gl = .45 + Math.sin(fr * .07 + i) * .35;
      ctx.fillStyle = `rgba(253,224,71,${gl})`;
      ctx.beginPath();
      ctx.arc(x + W * .14 + i * W * .18, y + H * .2, W * .045, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(x + W * .44, y + H * .3, W * .12, H * .2);
  } else if (kind === "mehlsack") {
    // Mehlsack – weißer Rundturm Ravensburgs
    ctx.fillStyle = "#f5f5f4";
    ctx.fillRect(x + W * .24, y - H * 1.1, W * .52, H * 2.1);
    ctx.fillStyle = "#e7e5e4";
    ctx.fillRect(x + W * .24, y - H * 1.1, W * .14, H * 2.1);
    ctx.fillStyle = "#d6d3d1";
    for (let i = 0; i < 4; i++) ctx.fillRect(x + W * .24, y - H * .86 + i * H * .52, W * .52, 2);
    ctx.fillStyle = "#1e293b";
    for (let i = 0; i < 3; i++) ctx.fillRect(cx - W * .05, y - H * .7 + i * H * .5, W * .1, H * .16);
    ctx.fillStyle = "#7f1d1d";
    ctx.beginPath();
    ctx.moveTo(x + W * .16, y - H * 1.08);
    ctx.lineTo(cx, y - H * 1.5);
    ctx.lineTo(x + W * .84, y - H * 1.08);
    ctx.fill();
    ctx.fillStyle = "#991b1b";
    ctx.fillRect(x + W * .18, y - H * 1.12, W * .64, H * .06);
    ctx.fillStyle = "#fde047";
    ctx.fillRect(cx - 1.5, y - H * 1.62, 3, H * .14);
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(cx, y - H * 1.64, W * .07, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawCityDeco(ctx, cityId, camX, camY, fr, found) {
  found = found || [];
  // Laternen
  cityLamps(cityId).forEach(([x, y]) => {
    const lx = x * KTS - camX + KTS / 2,
      ly = y * KTS - camY + KTS / 2;
    ctx.fillStyle = "#3f3f46";
    ctx.fillRect(lx - 2, ly - 6, 4, 20);
    ctx.fillStyle = "#52525b";
    ctx.fillRect(lx - 4, ly + 12, 8, 3);
    const glow = .45 + Math.sin(fr * .05 + x) * .3;
    ctx.fillStyle = `rgba(253,224,71,${glow * .5})`;
    ctx.beginPath();
    ctx.arc(lx, ly - 10, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    ctx.arc(lx, ly - 10, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#a16207";
    ctx.beginPath();
    ctx.moveTo(lx - 5, ly - 12);
    ctx.lineTo(lx, ly - 17);
    ctx.lineTo(lx + 5, ly - 12);
    ctx.fill();
  });
  // Wahrzeichen + Beschriftung
  cityMarks(cityId).forEach(mk => {
    const px = mk.x * KTS - camX,
      py = mk.y * KTS - camY;
    drawLandmark(ctx, mk.kind, px, py, mk.w, mk.h, fr);
    if (mk.label) {
      ctx.font = "bold 8px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const lx = px + mk.w * KTS / 2,
        ly = py + mk.h * KTS + 3;
      const isFound = found.includes(cityId + ":" + mk.kind);
      const lbl = (isFound ? "✓ " : "") + mk.label;
      ctx.fillStyle = "rgba(2,12,24,.72)";
      const tw = ctx.measureText(lbl).width;
      ctx.fillRect(lx - tw / 2 - 3, ly - 1, tw + 6, 11);
      ctx.fillStyle = isFound ? "#86efac" : "#e0f2fe";
      ctx.fillText(lbl, lx, ly);
    }
  });
}

/* ───── TILE DRAW ───── */
/* ───── AUTOTILING: weiche Übergänge zwischen Geländearten ─────
   Zeichnet nach dem Grundtile die Kanten zu andersartigen Nachbarn.
   "Rang" bestimmt, wer über wen läuft (höherer Rang überlagert). */
const TERRAIN_RANK = {
  [T_WATER]: 0,
  [T_SAND]: 1,
  [T_GRASS]: 2,
  [T_PATH]: 3
};
function terrainAt(map, x, y, W, H) {
  if (x < 0 || y < 0 || x >= W || y >= H) return null;
  const t = map[y]?.[x];
  return TERRAIN_RANK[t] !== undefined ? t : null;
}
function edgeColors(t) {
  if (t === T_SAND) return ["#d9b166", "#c69a52"];
  if (t === T_GRASS) return ["#1a6b34", "#2f8f4a"];
  if (t === T_PATH) return ["#a97142", "#8a5a2b"];
  return null;
}
// Zeichnet die Übergangskanten der Kachel (gx,gy) auf ihre Nachbarn
function drawAutotileEdges(ctx, map, t, px, py, S, fr, gx, gy, W, H) {
  const myRank = TERRAIN_RANK[t];
  if (myRank === undefined) return;
  const N = terrainAt(map, gx, gy - 1, W, H),
    So = terrainAt(map, gx, gy + 1, W, H),
    E = terrainAt(map, gx + 1, gy, W, H),
    Wt = terrainAt(map, gx - 1, gy, W, H);
  const sides = [[N, "n"], [So, "s"], [E, "e"], [Wt, "w"]];
  // Höherrangige Nachbarn ragen in diese Kachel hinein
  for (const [nb, dir] of sides) {
    if (nb === null || TERRAIN_RANK[nb] <= myRank) continue;
    const cols = edgeColors(nb);
    if (!cols) continue;
    const [c1, c2] = cols;
    const d = Math.max(3, Math.round(S * 0.18));
    ctx.fillStyle = c1;
    if (dir === "n") ctx.fillRect(px, py, S, d);
    if (dir === "s") ctx.fillRect(px, py + S - d, S, d);
    if (dir === "e") ctx.fillRect(px + S - d, py, d, S);
    if (dir === "w") ctx.fillRect(px, py, d, S);
    // Ausgefranste Kante: einzelne Pixel in Sekundärfarbe
    ctx.fillStyle = c2;
    const n = Math.round(S / 4);
    for (let i = 0; i < n; i++) {
      const h = (gx * 73856093 ^ gy * 19349663 ^ i * 83492791 ^ dir.charCodeAt(0)) >>> 0;
      const j = h % 3; // Tiefe der Ausfransung
      const o = i * 4 + (h >> 3) % 2; // Position entlang der Kante
      if (o >= S) continue;
      if (dir === "n") ctx.fillRect(px + o, py + d, 2, j);
      if (dir === "s") ctx.fillRect(px + o, py + S - d - j, 2, j);
      if (dir === "e") ctx.fillRect(px + S - d - j, py + o, j, 2);
      if (dir === "w") ctx.fillRect(px + d, py + o, j, 2);
    }
  }
  // Uferschaum: Wasser, das an Land grenzt
  if (t === T_WATER) {
    const foam = (dir, nb) => {
      if (nb === null || nb === T_WATER) return;
      const wob = Math.sin(fr * .07 + gx * 1.7 + gy * 2.1) * 1.6;
      ctx.fillStyle = "rgba(226,244,255,.62)";
      const th = 3;
      if (dir === "n") ctx.fillRect(px, py + 1 + wob * .4, S, th);
      if (dir === "s") ctx.fillRect(px, py + S - th - 1 + wob * .4, S, th);
      if (dir === "e") ctx.fillRect(px + S - th - 1 + wob * .4, py, th, S);
      if (dir === "w") ctx.fillRect(px + 1 + wob * .4, py, th, S);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      for (let i = 0; i < 4; i++) {
        const h = (gx * 2654435761 ^ gy * 40503 ^ i * 97) >>> 0;
        const o = h % (S - 4);
        if (dir === "n") ctx.fillRect(px + o, py + 4 + wob * .4, 2, 1);
        if (dir === "s") ctx.fillRect(px + o, py + S - 5 + wob * .4, 2, 1);
        if (dir === "e") ctx.fillRect(px + S - 5 + wob * .4, py + o, 1, 2);
        if (dir === "w") ctx.fillRect(px + 4 + wob * .4, py + o, 1, 2);
      }
    };
    foam("n", N);
    foam("s", So);
    foam("e", E);
    foam("w", Wt);
  }
}
function drawTile(ctx, t, px, py, S, fr, gx = 0, gy = 0) {
  const H = (a, b) => (gx * 73856093 ^ gy * 19349663 ^ a * 83492791 + b) >>> 0; // stabiler Hash je Weltkachel
  if (t === T_TREE) {
    // Waldboden + Baum mit Volumen
    ctx.fillStyle = "#123d12";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#0d2f0d";
    for (let i = 0; i < 4; i++) {
      const h = H(i, 7);
      ctx.fillRect(px + h % S, py + (h >> 4) % S, 2, 2);
    }
    ctx.fillStyle = "rgba(0,0,0,.3)";
    ctx.beginPath();
    ctx.ellipse(px + S / 2, py + S * .9, S * .34, S * .1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#5c3a1e";
    ctx.fillRect(px + S * .44, py + S * .66, S * .12, S * .28);
    ctx.fillStyle = "#3f2812";
    ctx.fillRect(px + S * .44, py + S * .66, S * .05, S * .28);
    const sw = Math.sin(fr * .025 + gx * 1.3 + gy * .7) * 1.2;
    ctx.fillStyle = "#0f3d1f";
    ctx.beginPath();
    ctx.arc(px + S / 2 + sw, py + S * .56, S * .42, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#166534";
    ctx.beginPath();
    ctx.arc(px + S * .44 + sw, py + S * .5, S * .34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#22c55e";
    ctx.beginPath();
    ctx.arc(px + S * .4 + sw, py + S * .38, S * .22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#4ade80";
    ctx.beginPath();
    ctx.arc(px + S * .36 + sw, py + S * .3, S * .1, 0, Math.PI * 2);
    ctx.fill();
  } else if (t === T_GRASS) {
    // Zweifarbiger Grasteppich mit Büscheln, Halmen und seltenen Blumen
    ctx.fillStyle = "#1a6b34";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#175c2c";
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) if ((gx + gy + r + c & 1) === 0) ctx.fillRect(px + c * S / 2, py + r * S / 2, S / 2, S / 2);
    ctx.fillStyle = "#2f8f4a";
    [[4, 6], [13, 17], [22, 8], [18, 23], [8, 13]].forEach(([bx, by], i) => {
      if (H(i, 3) % 5 < 3) {
        ctx.fillRect(px + bx, py + by, 2, 5);
        ctx.fillRect(px + bx - 2, py + by + 3, 6, 2);
      }
    });
    ctx.fillStyle = "#3faa5c";
    for (let i = 0; i < 3; i++) {
      const h = H(i, 11);
      ctx.fillRect(px + h % (S - 3), py + (h >> 5) % (S - 3), 1, 3);
    }
    const fh = (gx * 7 + gy * 13 >> 1) % 23;
    if (fh < 3) {
      const fc = ["#fde047", "#f9a8d4", "#fca5a5"][fh % 3];
      const fx = px + 6 + (gx * 3 + gy * 5) % 14,
        fy = py + 8 + (gx * 5 + gy) % 12;
      ctx.fillStyle = "#166534";
      ctx.fillRect(fx, fy, 1, 4);
      ctx.fillStyle = fc;
      ctx.beginPath();
      ctx.arc(fx, fy, 1.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(fx + 3, fy + 2, 1.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff7ae";
      ctx.fillRect(fx - 0.5, fy - 0.5, 1, 1);
    }
  } else if (t === T_PATH) {
    // Kopfsteinpflaster
    ctx.fillStyle = "#8a5a2b";
    ctx.fillRect(px, py, S, S);
    const stones = [[2, 2, 12, 9], [16, 3, 13, 8], [3, 13, 10, 8], [15, 13, 14, 9], [4, 23, 11, 7], [17, 24, 12, 6]];
    stones.forEach(([sx, sy, sw2, sh], i) => {
      const v = H(i, 5) % 3;
      ctx.fillStyle = ["#a97142", "#b58253", "#9c6636"][v];
      ctx.fillRect(px + sx, py + sy, sw2, sh);
      ctx.fillStyle = "rgba(255,235,200,.18)";
      ctx.fillRect(px + sx, py + sy, sw2, 1);
      ctx.fillStyle = "rgba(60,30,10,.28)";
      ctx.fillRect(px + sx, py + sy + sh - 1, sw2, 1);
    });
  } else if (t === T_WATER) {
    // Tiefenverlauf + wandernde Lichtreflexe
    const g = ctx.createLinearGradient(px, py, px, py + S);
    g.addColorStop(0, "#0b4f7e");
    g.addColorStop(1, "#083a5f");
    ctx.fillStyle = g;
    ctx.fillRect(px, py, S, S);
    const t1 = fr * .03;
    ctx.strokeStyle = "rgba(147,197,253,.20)";
    ctx.lineWidth = 1.6;
    [6, 15, 24].forEach((oy, i) => {
      ctx.beginPath();
      for (let sx2 = 0; sx2 <= S; sx2 += 4) {
        const yy = py + oy + Math.sin((px + sx2) * .09 + t1 + i) * 1.8;
        sx2 === 0 ? ctx.moveTo(px, yy) : ctx.lineTo(px + sx2, yy);
      }
      ctx.stroke();
    });
    const sparkle = (Math.sin(t1 * 2 + gx * 1.7 + gy * 2.3) + 1) / 2;
    if (sparkle > .86) {
      ctx.fillStyle = "rgba(219,240,255,.75)";
      ctx.fillRect(px + (gx * 5 + gy * 3) % (S - 6) + 3, py + (gx * 7 + gy) % (S - 6) + 3, 2, 2);
    }
  } else if (t === T_SAND) {
    // Kiesiger Uferstreifen
    ctx.fillStyle = "#d9b166";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#c69a52";
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) if ((gx + gy + r * 2 + c & 1) === 0) ctx.fillRect(px + c * S / 2, py + r * S / 2, S / 2, S / 2);
    for (let i = 0; i < 7; i++) {
      const h = H(i, 17);
      ctx.fillStyle = ["#a97a3a", "#e6c98d", "#b98c46"][h % 3];
      ctx.fillRect(px + h % (S - 3), py + (h >> 6) % (S - 3), 2, 2);
    }
  } else if (t === T_HOUSE) {
    // Fachwerk-Altstadthaus
    ctx.fillStyle = "#e8dcc8";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = "#8a2b2b";
    ctx.beginPath();
    ctx.moveTo(px - 1, py + S * .42);
    ctx.lineTo(px + S / 2, py + 2);
    ctx.lineTo(px + S + 1, py + S * .42);
    ctx.fill();
    ctx.fillStyle = "#a13333";
    for (let i = 0; i < 3; i++) ctx.fillRect(px + 2, py + S * .14 + i * S * .1, S - 4, 2);
    ctx.fillStyle = "#f5ecd9";
    ctx.fillRect(px + 1, py + S * .42, S - 2, S * .58);
    ctx.fillStyle = "#6b4423";
    ctx.fillRect(px + 1, py + S * .42, S - 2, 2);
    ctx.fillRect(px + 1, py + S * .7, S - 2, 2);
    ctx.fillRect(px + S * .46, py + S * .44, 2, S * .26);
    ctx.fillRect(px + 2, py + S * .44, 2, S * .54);
    ctx.fillRect(px + S - 4, py + S * .44, 2, S * .54);
    ctx.fillStyle = "#7dd3fc";
    ctx.fillRect(px + S * .14, py + S * .5, S * .22, S * .16);
    ctx.fillRect(px + S * .62, py + S * .5, S * .22, S * .16);
    ctx.fillStyle = "#5c3317";
    ctx.fillRect(px + S * .38, py + S * .74, S * .24, S * .26);
    ctx.fillStyle = "#fbbf24";
    ctx.fillRect(px + S * .56, py + S * .85, 2, 2);
  } else if (t === T_OWPIER) {
    // Wasser drunter
    drawTile(ctx, T_WATER, px, py, S, fr, gx, gy);
    // Holzplanken
    ctx.fillStyle = "#78350f";
    ctx.fillRect(px + S * .18, py, S * .64, S);
    ctx.fillStyle = "#92400e";
    for (let i = 0; i < 4; i++) ctx.fillRect(px + S * .18, py + i * S * .26 + 2, S * .64, S * .16);
    ctx.fillStyle = "#5c2c0a";
    ctx.fillRect(px + S * .18, py, 2, S);
    ctx.fillRect(px + S * .8, py, 2, S);
  } else if (t === T_DIVE) {
    drawTile(ctx, T_SAND, px, py, S, fr, gx, gy);
    const bob = Math.sin(fr * .08) * 1.5;
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(px + S / 2, py + S * .86, S * .26, S * .08, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath();
    ctx.arc(px + S / 2, py + S * .62 + bob, S * .2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(px + S * .3, py + S * .56 + bob, S * .4, S * .1);
    ctx.fillStyle = "#475569";
    ctx.fillRect(px + S * .48, py + S * .12 + bob, 2, S * .42);
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(px + S * .52, py + S * .12 + bob, S * .34, S * .22);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + S * .52, py + S * .12 + bob);
    ctx.lineTo(px + S * .86, py + S * .34 + bob);
    ctx.stroke();
  } else if (t === T_WALOX) {
    drawTile(ctx, T_WATER, px, py, S, fr, gx, gy);
    ctx.fillStyle = "#78350f";
    ctx.fillRect(px + S * .18, py, S * .64, S * .7);
    ctx.fillStyle = "#92400e";
    for (let i = 0; i < 2; i++) ctx.fillRect(px + S * .18, py + i * S * .26 + 2, S * .64, S * .16);
    ctx.fillStyle = "#5c2c0a";
    ctx.fillRect(px + S * .18, py, 2, S * .7);
    ctx.fillRect(px + S * .8, py, 2, S * .7);
  } else {
    const cols = {
      5: "#dc2626",
      6: "#2563eb",
      7: "#7c3aed",
      8: "#059669",
      9: "#d97706",
      13: "#0d9488"
    };
    ctx.fillStyle = "#a16207";
    ctx.fillRect(px, py, S, S);
    ctx.fillStyle = cols[t] || "#fff";
    ctx.fillRect(px + 3, py + 3, S - 6, S - 6);
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(px + S * .28 | 0, py + S * .22 | 0, S * .44 | 0, S * .78 | 0);
    ctx.fillStyle = "white";
    ctx.font = `bold ${S * .38 | 0}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("▲", px + S / 2, py + S * .35);
  }
}
/* ───── PLAYER DRAW (gender aware) ───── */
function drawPlayer(ctx, px, py, facing, moving, fr, gender = "m") {
  const f = gender === "f";
  // 4-Phasen-Laufzyklus statt zwei – wirkt deutlich flüssiger
  const ph = moving ? Math.floor(fr / 6) % 4 : 0;
  const legL = [0, 3, 0, -3][ph],
    legR = [0, -3, 0, 3][ph];
  const bob = moving ? [0, -1, 0, -1][ph] : Math.round(Math.sin(fr * .05) * 0.6); // leichtes Atmen im Stand
  const armSw = moving ? [0, 2, 0, -2][ph] : 0;
  const y = py + bob;

  // Farben
  const COAT = f ? "#0f766e" : "#1d4ed8",
    COAT_D = f ? "#0b5b55" : "#1e3a8a",
    COAT_L = f ? "#14b8a6" : "#3b82f6";
  const SKIN = "#f2c396",
    SKIN_SH = "#d9a071";
  const HAIR = f ? "#4a2c12" : "#3b2410",
    HAIR_L = f ? "#6b4423" : "#5c3a1e";
  const PANTS = "#1f2937",
    PANTS_D = "#111827",
    BOOT = "#3f2a17",
    BOOT_D = "#2a1b0e";
  const HAT = "#a16207",
    HAT_D = "#78350f",
    HAT_BAND = f ? "#f472b6" : "#166534";

  // Schlagschatten
  ctx.fillStyle = "rgba(0,0,0,.32)";
  ctx.beginPath();
  ctx.ellipse(px, py + 11, 9.5, 3.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Beine ──
  ctx.fillStyle = PANTS;
  ctx.fillRect(px - 6, y + 2, 5, 8 + legL);
  ctx.fillRect(px + 1, y + 2, 5, 8 + legR);
  ctx.fillStyle = PANTS_D;
  ctx.fillRect(px - 6, y + 2, 2, 8 + legL);
  ctx.fillRect(px + 1, y + 2, 2, 8 + legR);
  // Stiefel mit Sohle
  ctx.fillStyle = BOOT;
  ctx.fillRect(px - 7, y + 10 + legL, 6, 4);
  ctx.fillRect(px + 1, y + 10 + legR, 6, 4);
  ctx.fillStyle = BOOT_D;
  ctx.fillRect(px - 7, y + 13 + legL, 6, 1);
  ctx.fillRect(px + 1, y + 13 + legR, 6, 1);

  // ── Rumpf: Anglerweste über Pullover ──
  ctx.fillStyle = COAT;
  ctx.fillRect(px - 8, y - 10, 16, 13);
  ctx.fillStyle = COAT_D;
  ctx.fillRect(px - 8, y - 10, 4, 13); // Schattenseite
  ctx.fillStyle = COAT_L;
  ctx.fillRect(px + 5, y - 10, 3, 13); // Lichtkante
  // Reißverschluss / Knopfleiste
  ctx.fillStyle = "#e2e8f0";
  ctx.fillRect(px - 1, y - 9, 1, 11);
  // Westentaschen
  ctx.fillStyle = COAT_D;
  ctx.fillRect(px - 7, y - 3, 4, 4);
  ctx.fillRect(px + 3, y - 3, 4, 4);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(px - 7, y - 3, 4, 1);
  ctx.fillRect(px + 3, y - 3, 4, 1);
  // Gurt quer über die Brust
  ctx.fillStyle = "#7c2d12";
  if (facing === "left") ctx.fillRect(px - 8, y - 7, 13, 2);else if (facing === "right") ctx.fillRect(px - 5, y - 7, 13, 2);else ctx.fillRect(px - 8, y - 6, 16, 2);

  // ── Arme ──
  ctx.fillStyle = COAT;
  if (facing === "left") {
    ctx.fillRect(px - 12, y - 8 + armSw, 5, 9);
  } else if (facing === "right") {
    ctx.fillRect(px + 7, y - 8 - armSw, 5, 9);
  } else {
    ctx.fillRect(px - 12, y - 7 + armSw, 5, 9);
    ctx.fillRect(px + 7, y - 7 - armSw, 5, 9);
  }
  // Hände
  ctx.fillStyle = SKIN;
  if (facing === "left") {
    ctx.fillRect(px - 12, y + 1 + armSw, 5, 3);
  } else if (facing === "right") {
    ctx.fillRect(px + 7, y + 1 - armSw, 5, 3);
  } else {
    ctx.fillRect(px - 12, y + 2 + armSw, 5, 3);
    ctx.fillRect(px + 7, y + 2 - armSw, 5, 3);
  }

  // ── Hals & Kopf ──
  ctx.fillStyle = SKIN_SH;
  ctx.fillRect(px - 2, y - 12, 4, 3);
  ctx.fillStyle = SKIN;
  ctx.beginPath();
  ctx.arc(px, y - 16, 7.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = SKIN_SH;
  ctx.beginPath();
  ctx.arc(px - 2.5, y - 16, 7.6, 0, Math.PI * 2);
  ctx.fill(); // Wangenschatten
  ctx.fillStyle = SKIN;
  ctx.beginPath();
  ctx.arc(px + 0.6, y - 16.4, 7, 0, Math.PI * 2);
  ctx.fill();
  // Ohren
  ctx.fillStyle = SKIN_SH;
  if (facing !== "up") {
    ctx.fillRect(px - 8, y - 17, 2, 3);
    ctx.fillRect(px + 6, y - 17, 2, 3);
  }

  ctx.fillStyle = HAIR;
  if (f) {
    ctx.fillRect(px - 9, y - 15, 3, 10);
    ctx.fillRect(px + 6, y - 15, 3, 10); // seitliche Strähnen
    ctx.fillRect(px - 10, y - 13, 2, 11);
    ctx.fillRect(px + 8, y - 13, 2, 11);
    ctx.fillStyle = HAIR_L;
    ctx.fillRect(px - 9, y - 15, 1, 10);
    ctx.fillStyle = HAIR;
    ctx.fillRect(px - 4, y - 22, 8, 4); // Pony
  } else {
    ctx.fillRect(px - 7, y - 21, 14, 4);
    ctx.fillStyle = HAIR_L;
    ctx.fillRect(px - 7, y - 21, 14, 1);
    ctx.fillStyle = HAIR;
    ctx.fillRect(px - 8, y - 19, 2, 4);
    ctx.fillRect(px + 6, y - 19, 2, 4);
  }

  // ── Anglerhut ──
  ctx.fillStyle = HAT_D;
  ctx.beginPath();
  ctx.ellipse(px, y - 20, 11, 3.4, 0, 0, Math.PI * 2);
  ctx.fill(); // Krempe
  ctx.fillStyle = HAT;
  ctx.beginPath();
  ctx.ellipse(px, y - 21, 11, 3.2, 0, 0, Math.PI * 2);

      const items = {

      if (it.rods) return {

        rods: (p.rods || 0) + it.rods

      if (!m) return p;
      if (it.heal) {

        const team = [...p.team];
        team[idx] = {

          hp: Math.min(m.maxHp, m.hp + it.heal)

          items

        team[idx] = {
          ...m,
          hp: Math.max(1, Math.round(m.maxHp * it.revive))

        return {

          team,
          items
        };
      }
