# nginx-Konfiguration für AquariumMon.
#
# Variante A – eigene Seite (z. B. http://aquariummon.lan/):
#   Datei nach /etc/nginx/sites-available/aquariummon kopieren, server_name anpassen,
#   nach sites-enabled verlinken, dann: sudo nginx -t && sudo systemctl reload nginx
#
# Variante B – Unterpfad in einer bestehenden Seite (http://dein-server/aquariummon/):
#   nur den Block "location /aquariummon/" unten in den vorhandenen server-Block übernehmen.

server {
    listen 80;
    server_name aquariummon.lan;   # anpassen (oder "_" für alle)

    root /var/www/aquariummon;
    index index.html;

    # Git-Daten und Hilfsdateien nicht ausliefern
    location ~ /\.(git|github) { deny all; return 404; }
    location ~ ^/(deploy|scripts)/ { deny all; return 404; }

    # HTML nie zwischenspeichern, damit nach jedem Update sofort die neue Version kommt
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

